name: Build bitrl

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    # Everything except Project Chrono. This is the fast feedback job.
    name: Core (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release, Debug ]
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: ./ci/install_deps.sh

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DENABLE_CHRONO=OFF
          -DENABLE_TESTS=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  chrono:
    # The full build. Chrono is built from source once and then restored
    # from the cache for as long as ci/build_chrono.sh does not change.
    name: Chrono (Release)
    runs-on: ubuntu-24.04
    env:
      CHRONO_PREFIX: ${{ github.workspace }}/.deps/chrono
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: ./ci/install_deps.sh --with-chrono-deps

      - name: Restore Chrono
        id: chrono-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.CHRONO_PREFIX }}
          key: chrono-${{ runner.os }}-24.04-${{ hashFiles('ci/build_chrono.sh') }}

      - name: Build Chrono
        if: steps.chrono-cache.outputs.cache-hit != 'true'
        run: ./ci/build_chrono.sh "$CHRONO_PREFIX"

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$CHRONO_PREFIX"
          -DENABLE_TESTS=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

name: Build bitrl

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # bitrl against bitsim master built without Chrono, and the CPU libtorch
    name: Build and test (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release, Debug ]
    env:
      DEPS: ${{ github.workspace }}/.deps
    steps:
      - uses: actions/checkout@v4

      # bitsim's script installs what it needs: Boost, Eigen, GTest,
      # OpenCV and Paho MQTT
      - name: Install dependencies
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/pockerman/bitsim/master/ci/install_deps.sh \
            --output "$RUNNER_TEMP/install_deps.sh"
          bash "$RUNNER_TEMP/install_deps.sh"
          sudo apt-get install -y libtbb-dev unzip

      - name: Restore libtorch
        id: libtorch-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPS }}/libtorch
          key: libtorch-${{ runner.os }}-${{ hashFiles('ci/install_libtorch.sh') }}

      - name: Download libtorch
        if: steps.libtorch-cache.outputs.cache-hit != 'true'
        run: ./ci/install_libtorch.sh "$DEPS"

      - name: Install bitsim
        run: ./ci/install_bitsim.sh "$DEPS/bitsim"

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_PREFIX_PATH="$DEPS/bitsim;$DEPS/libtorch"
          -DENABLE_TESTS=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Check the install
        run: ./ci/check_install.sh build "$DEPS/bitsim;$DEPS/libtorch"

  docs:
    # The example pages that the documentation site, bitrl_cuberl_docs, pulls
    # in from here
    name: Docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Check the example pages
        run: ./ci/check_docs.sh

  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # format.sh says which version to use; other versions format some code
      # differently
      - name: Install clang-format
        run: pipx install clang-format==14.0.6

      - name: Check the format
        run: ./format.sh --check
